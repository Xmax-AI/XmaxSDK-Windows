name: SDK and X-Lab
on: [push, pull_request, workflow_dispatch]
jobs:
  sdk:
    strategy:
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cmake ninja
      - name: Build and test portable SDK
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake --preset windows
            cmake --build --preset windows
            ctest --preset windows
          else
            cmake --preset core
            cmake --build --preset core
            ctest --preset core
          fi
  windows-example:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cmake aqtinstall==3.3.0
      - name: Install Qt and native RTC dependencies
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia qtimageformats -O .build/qt
          ./scripts/get-agora.ps1
      - name: Build Windows DLL and example with Agora
        shell: pwsh
        run: |
          $qt = "$PWD/.build/qt/6.8.3/msvc2022_64"
          $agora = "$PWD/.build/vendor/agora/Agora_Native_SDK_for_Windows_FULL/sdk"
          cmake --preset windows -DXMAX_BUILD_EXAMPLE=ON -DXMAX_WITH_AGORA=ON "-DXMAX_AGORA_ROOT=$agora" "-DCMAKE_PREFIX_PATH=$qt"
          cmake --build --preset windows
          & "$qt/bin/windeployqt.exe" --release --qmldir Examples/XLab/qml .build/windows/Examples/XLab/Release/XLab.exe
          ctest --preset windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-xlab-and-ui-screenshots
          path: |
            .build/windows/Examples/XLab/Release/
            .build/windows/screenshots/
            .build/windows/Testing/Temporary/LastTest.log
