name: Windows package builder
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    name: Windows SDK and package
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked Qt dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $locked = Get-Content .cicd/dependencies.json -Raw | ConvertFrom-Json
          python -m pip install "cmake==$($locked.cmake)" "aqtinstall==$($locked.aqtinstall)"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m aqt install-qt windows desktop $locked.qt.version $locked.qt.architecture -m qtmultimedia qtimageformats -O .build/qt
          if ($LASTEXITCODE -ne 0) { throw 'Qt installation failed' }
      - name: Build and consume SDK without Qt or RTC
        shell: pwsh
        run: |
          python .cicd/pipeline.py verify --build-dir .build/windows-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and validate release packages
        shell: pwsh
        run: |
          $locked = Get-Content .cicd/dependencies.json -Raw | ConvertFrom-Json
          $qt = Join-Path $PWD ".build/qt/$($locked.qt.version)/msvc2022_64"
          python .cicd/pipeline.py build-windows --qt-prefix $qt --build-dir .build/windows-release --output-dir .build/artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified release candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-candidate
          path: .build/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics
          path: |
            .build/windows-*/Testing/Temporary/*.log
            .build/windows-*/screenshots/
            .build/windows-*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
