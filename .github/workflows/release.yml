name: SDK Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version in VERSION (for example 0.2.0)'
        type: string
        required: true
      publish:
        description: 'Publish a GitHub Release after all checks (false only builds candidate artifacts)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sdk-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify requested source version
        run: |
          python .cicd/check-source.py
          python -c 'import os; from pathlib import Path; assert os.environ["RELEASE_VERSION"] == Path("VERSION").read_text().strip(), "Requested version differs from VERSION"'
          if [ "$PUBLISH" = "true" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            python .cicd/workflow.py check-release "$RELEASE_VERSION"
          fi
  package:
    name: Build release candidates
    needs: preflight
    uses: ./.github/workflows/windows-package.yml
  publish:
    name: Publish explicitly requested release
    if: inputs.publish
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-candidate
          path: .build/artifacts
      - name: Recheck provenance and publish immutable assets
        run: python .cicd/workflow.py release "$RELEASE_VERSION" --artifacts-dir .build/artifacts --publish
